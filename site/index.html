<title>나의 학기 비서</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Space+Grotesk:wght@500;700&display=swap">
<style>
/* Layout concept: 상단 탭(오늘·주간 계획·캘린더·성적)과 과목 탭. 페이지마다 같은 카드 문법. 데이터는 저장소에서 읽고, 고친 건 바로 저장 */
:root {
  --bg: #f2f4f8;
  --surface: #ffffff;
  --surface-2: #eaeef5;
  --line: #d9dfe9;
  --fg: #141a26;
  --fg-2: #485268;
  --fg-3: #78839a;
  --accent: #2c53d1;
  --accent-soft: #e4eafb;
  --accent-fg: #ffffff;
  --urgent: #cf3b27;
  --urgent-soft: #fdebe8;
  --soon: #a86a07;
  --soon-soft: #fff2d9;
  --ok: #1b7f55;
  --ok-soft: #e2f4ea;
  --c-phys2: #3c74d9;
  --c-physlab: #8a5fd0;
  --c-math2: #c2527a;
  --c-mathex: #7d879c;
  --c-hist: #d98324;
  --c-bio: #5a9a2b;
  --c-ship: #159596;
  --font-body: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --font-num: "Space Grotesk", "Noto Sans KR", system-ui, sans-serif;
  --radius: 12px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e121a; --surface: #161b25; --surface-2: #1d2331; --line: #2a3142;
    --fg: #e8ecf5; --fg-2: #aeb7ca; --fg-3: #7f899e;
    --accent: #8fa8ff; --accent-soft: #1f2a4f; --accent-fg: #0e121a;
    --urgent: #ff7d66; --urgent-soft: #3a201c; --soon: #f0b44c; --soon-soft: #35290f;
    --ok: #4fd19a; --ok-soft: #12332a;
    --c-phys2: #6a9cf2; --c-physlab: #b394ec; --c-math2: #e07fa3; --c-mathex: #a1abc0;
    --c-hist: #f0a24f; --c-bio: #86c457; --c-ship: #45c4c5;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e121a; --surface: #161b25; --surface-2: #1d2331; --line: #2a3142;
  --fg: #e8ecf5; --fg-2: #aeb7ca; --fg-3: #7f899e;
  --accent: #8fa8ff; --accent-soft: #1f2a4f; --accent-fg: #0e121a;
  --urgent: #ff7d66; --urgent-soft: #3a201c; --soon: #f0b44c; --soon-soft: #35290f;
  --ok: #4fd19a; --ok-soft: #12332a;
  --c-phys2: #6a9cf2; --c-physlab: #b394ec; --c-math2: #e07fa3; --c-mathex: #a1abc0;
  --c-hist: #f0a24f; --c-bio: #86c457; --c-ship: #45c4c5;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  margin: 0; background: var(--bg); color: var(--fg);
  font-family: var(--font-body); font-size: 15px; line-height: 1.55;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 56px;
}
button, textarea, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.wrap { max-width: 1120px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }
.num { font-family: var(--font-num); font-variant-numeric: tabular-nums; }

.topbar { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.brand { font-weight: 700; font-size: 14px; color: var(--fg-2); letter-spacing: .02em; }
.sync { font-size: 12.5px; color: var(--fg-3); }

.navs { display: flex; flex-direction: column; gap: 8px; }
.tabs { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab { flex: none; text-decoration: none; color: var(--fg-2); border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 4px 14px; font-size: 14px; font-weight: 500; display: inline-flex; align-items: center; gap: 6px; }
.tab[aria-current="page"] { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); font-weight: 700; }
.tabs.sub .tab { font-size: 13px; padding: 3px 11px; }
.tabs.sub .tab[aria-current="page"] { background: var(--surface-2); color: var(--fg); border-color: var(--cc, var(--accent)); }

h1.page { margin: 2px 0 0; font-size: clamp(24px, 4.5vw, 34px); line-height: 1.25; font-weight: 700; text-wrap: balance; }
.eyebrow { margin: 0; font-size: 13px; color: var(--fg-3); letter-spacing: .04em; }
.lead { margin: 4px 0 0; color: var(--fg-2); font-size: 14.5px; }

.brief { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px 16px 14px; min-width: 0; }
.card h2 { margin: 0 0 4px; font-size: 16px; line-height: 1.4; font-weight: 700; text-wrap: balance; }
.card h3 { margin: 0 0 6px; font-size: 14.5px; }
.card .sub { margin: 0 0 10px; font-size: 13px; color: var(--fg-3); }
.mini { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.mini li { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; font-size: 14px; }
.mini .t { min-width: 0; overflow-wrap: anywhere; }
.mini .t small { display: block; color: var(--fg-3); font-size: 12.5px; }
.empty { color: var(--fg-3); font-size: 14px; margin: 0; }
.note { font-size: 13px; color: var(--fg-3); margin: 6px 0 0; }
.stack { display: flex; flex-direction: column; gap: 14px; }

.badge { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 12px; font-weight: 700; white-space: nowrap; background: var(--surface-2); color: var(--fg-2); font-family: var(--font-num); }
.badge.urgent { background: var(--urgent-soft); color: var(--urgent); }
.badge.soon { background: var(--soon-soft); color: var(--soon); }
.badge.ok { background: var(--ok-soft); color: var(--ok); }
.badge.acc { background: var(--accent-soft); color: var(--accent); }
.pill { display: inline-block; padding: 0 7px; border-radius: 6px; font-size: 11.5px; font-weight: 500; background: var(--surface-2); color: var(--fg-2); }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--cc, var(--fg-3)); flex: none; display: inline-block; }

.cols { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 20px; align-items: start; }
.section-h { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin: 0 0 10px; }
.section-h h2 { margin: 0; font-size: 17px; font-weight: 700; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 3px 11px; font-size: 13px; color: var(--fg-2); display: inline-flex; align-items: center; gap: 6px; }
.chip[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }

.day { margin-bottom: 16px; }
.day-h { display: flex; align-items: center; gap: 8px; margin: 0 0 6px; font-size: 13.5px; font-weight: 700; color: var(--fg-2); }
.day-h.today { color: var(--accent); }
.rows { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
.row { display: grid; grid-template-columns: 22px 54px minmax(0, 1fr) auto; gap: 10px; align-items: start; padding: 11px 14px; border-top: 1px solid var(--line); }
.row:first-child { border-top: 0; }
.row.done .title { text-decoration: line-through; color: var(--fg-3); }
.row .time { font-size: 13px; color: var(--fg-3); padding-top: 1px; }
.row .title { font-weight: 500; overflow-wrap: anywhere; }
.row .meta { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin-top: 3px; font-size: 12.5px; color: var(--fg-3); }
.mini-btn { border: 1px solid var(--line); background: transparent; border-radius: 7px; padding: 0 8px; font-size: 12px; color: var(--fg-2); height: 24px; }
.check { width: 20px; height: 20px; border-radius: 6px; border: 1.5px solid var(--fg-3); background: transparent; padding: 0; display: grid; place-items: center; margin-top: 1px; }
.check[aria-checked="true"] { background: var(--ok); border-color: var(--ok); }
.check[aria-checked="true"]::after { content: ""; width: 5px; height: 10px; border: solid var(--surface); border-width: 0 2px 2px 0; transform: translateY(-1px) rotate(45deg); }
.check:disabled { opacity: .45; cursor: default; }
.nocheck { width: 20px; height: 20px; display: grid; place-items: center; }
.alert { background: var(--urgent-soft); border: 1px solid var(--urgent); border-radius: var(--radius); padding: 12px 14px; margin-bottom: 16px; }
.alert h3 { margin: 0 0 6px; font-size: 14.5px; color: var(--urgent); }
.alert .row { background: transparent; border-top-color: transparent; padding: 6px 0; }
.link-btn { background: none; border: 0; color: var(--accent); font-size: 13.5px; padding: 4px 0; text-decoration: underline; text-underline-offset: 3px; }

.side { display: flex; flex-direction: column; gap: 16px; }
.course { display: flex; flex-direction: column; gap: 2px; padding: 10px 0; border-top: 1px solid var(--line); }
.course:first-of-type { border-top: 0; padding-top: 0; }
.course a.nm { display: flex; align-items: center; gap: 8px; font-size: 14.5px; font-weight: 700; color: var(--fg); text-decoration: none; }
.course span.g { font-size: 12.5px; color: var(--fg-3); }
.course span.n { font-size: 13px; color: var(--fg-2); }

.btn { border: 0; border-radius: 9px; background: var(--accent); color: var(--accent-fg); padding: 7px 14px; font-weight: 700; font-size: 14px; }
.btn.ghost { background: var(--surface-2); color: var(--fg); font-weight: 500; }
.btn.danger { background: var(--urgent-soft); color: var(--urgent); }
.btn:disabled { opacity: .5; cursor: default; }
textarea, input[type="text"], input[type="date"], input[type="time"], select { width: 100%; border: 1px solid var(--line); border-radius: 9px; background: var(--surface); padding: 7px 10px; }
textarea { min-height: 76px; resize: vertical; }
.ask-actions { display: flex; gap: 8px; margin-top: 8px; align-items: center; flex-wrap: wrap; }
.answer { margin-top: 10px; white-space: pre-wrap; overflow-wrap: anywhere; font-size: 14px; background: var(--surface-2); border-radius: 10px; padding: 10px 12px; }
.qchips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }

/* 주간 계획 */
.week { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.2fr); gap: 16px; }
.week .when { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
.week .when h2 { margin: 0; font-size: 16px; }
.plan { display: grid; grid-template-columns: 22px minmax(0, 1fr) auto; gap: 10px; align-items: start; padding: 8px 0; border-top: 1px solid var(--line); }
.plan:first-child { border-top: 0; }
.plan.done .ptext { text-decoration: line-through; color: var(--fg-3); }
.ptext { background: none; border: 0; padding: 0; text-align: left; font-size: 14.5px; overflow-wrap: anywhere; }
.plan .meta { display: flex; gap: 6px; align-items: center; font-size: 12.5px; color: var(--fg-3); margin-top: 2px; }
.addrow { display: grid; grid-template-columns: minmax(0, 1fr) 150px auto; gap: 8px; margin-top: 10px; }
.cal-line { display: flex; gap: 8px; align-items: baseline; font-size: 13.5px; padding: 5px 0; border-top: 1px solid var(--line); }
.cal-line:first-child { border-top: 0; }
.cal-line .d { width: 62px; flex: none; color: var(--fg-3); }

/* 캘린더 */
.cal-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-bottom: 8px; }
.cal-top strong { font-size: 18px; }
.cal-nav { display: flex; gap: 6px; }
.icon-btn { min-width: 32px; height: 32px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); font-size: 15px; line-height: 1; padding: 0 10px; }
.bigcal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
.bigcal .wd { font-size: 12px; color: var(--fg-3); text-align: center; padding: 2px 0; }
.bigcal .cell { min-height: 98px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); padding: 4px 5px; display: flex; flex-direction: column; gap: 3px; text-align: left; min-width: 0; align-items: stretch; }
.bigcal .cell.out { opacity: .5; }
.bigcal .cell.today { box-shadow: inset 0 0 0 1.5px var(--accent); }
.bigcal .cell.sel { background: var(--accent-soft); }
.bigcal .cell .dn { font-size: 12.5px; font-weight: 700; color: var(--fg-2); }
.evt { display: flex; align-items: center; gap: 4px; font-size: 11.5px; line-height: 1.3; border: 0; background: var(--surface-2); border-radius: 5px; padding: 1px 4px; text-align: left; min-width: 0; width: 100%; }
.evt span.tx { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.evt.done span.tx { text-decoration: line-through; color: var(--fg-3); }
.more { font-size: 11px; color: var(--fg-3); }
.dots { display: none; gap: 2px; flex-wrap: wrap; }
.dots i { width: 6px; height: 6px; border-radius: 50%; background: var(--cc); display: block; }

/* 성적 */
.gtable { width: 100%; border-collapse: collapse; font-size: 14px; }
.gtable th, .gtable td { text-align: left; padding: 8px 6px; border-top: 1px solid var(--line); vertical-align: top; }
.gtable th { font-size: 12.5px; color: var(--fg-3); font-weight: 500; border-top: 0; }
.tscroll { overflow-x: auto; }
.comp { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 10px; padding: 9px 0; border-top: 1px solid var(--line); align-items: center; }
.comp:first-of-type { border-top: 0; }
.comp .cn { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-weight: 500; }
.bar { grid-column: 1 / -1; height: 7px; background: var(--surface-2); border-radius: 99px; overflow: hidden; }
.bar > div { height: 100%; background: var(--accent); border-radius: 99px; }
.bar.good > div { background: var(--ok); }
.comp small { grid-column: 1 / -1; color: var(--fg-3); font-size: 12.5px; }
.big { font-family: var(--font-num); font-size: 26px; font-weight: 700; }

/* 과목 */
.ch { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.ch .dot { width: 14px; height: 14px; }
details.sec { border-top: 1px solid var(--line); padding: 8px 0; }
details.sec:first-of-type { border-top: 0; padding-top: 0; }
details.sec summary { cursor: pointer; font-weight: 700; font-size: 14.5px; }
details.sec ul, ul.lines { margin: 6px 0 2px; padding-left: 18px; font-size: 14px; color: var(--fg-2); }
details.sec li, ul.lines li { margin: 3px 0; overflow-wrap: anywhere; }
.guide { border-top: 1px solid var(--line); padding: 10px 0; }
.guide:first-of-type { border-top: 0; padding-top: 0; }
.guide .gh { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-weight: 700; font-size: 14.5px; }

/* 모달 */
.overlay { position: fixed; inset: 0; background: rgba(8, 12, 20, .55); display: flex; align-items: flex-start; justify-content: center; padding: max(16px, env(safe-area-inset-top, 0px)) 16px 16px; overflow-y: auto; z-index: 30; }
.modal { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; width: 100%; max-width: 460px; padding: 16px; margin-top: 8vh; }
.modal h2 { margin: 0 0 10px; font-size: 17px; }
.fld { display: flex; flex-direction: column; gap: 4px; margin-bottom: 10px; font-size: 13px; color: var(--fg-3); }
.fld2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.inl { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--fg); margin-bottom: 10px; }
.inl input { width: auto; }
.modal .btns { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; margin-top: 6px; }
.err { color: var(--urgent); font-size: 13px; min-height: 18px; margin: 0 0 6px; }

.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); background: var(--fg); color: var(--bg); padding: 8px 14px; border-radius: 9px; font-size: 13.5px; z-index: 40; }

@media (max-width: 960px) {
  .brief { grid-template-columns: 1fr; }
  .cols { grid-template-columns: minmax(0, 1fr); }
  .week { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 720px) {
  .bigcal .cell { min-height: 62px; }
  .bigcal .evt { display: none; }
  .bigcal .more { display: none; }
  .dots { display: flex; }
  .addrow { grid-template-columns: minmax(0, 1fr); }
  .row { grid-template-columns: 22px 46px minmax(0, 1fr) auto; gap: 8px; padding: 10px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>

<div class="wrap">
  <div class="topbar">
    <span class="brand">나의 학기 비서 · 2026학년도 2학기</span>
    <span class="sync" id="sync">일정을 불러오는 중입니다</span>
  </div>
  <div class="navs">
    <nav class="tabs" id="nav" aria-label="페이지"></nav>
    <nav class="tabs sub" id="navCourses" aria-label="과목"></nav>
  </div>
  <main id="view"><p class="empty">불러오는 중입니다</p></main>
</div>
<div class="overlay" id="modal" hidden></div>
<div class="toast" id="toast" hidden></div>

<script>
(function () {
  var KST = "Asia/Seoul";
  var WD = ["일", "월", "화", "수", "목", "금", "토"];
  var KIND = { assignment: "과제", exam: "시험", class: "수업 변경", event: "행사", todo: "할 일" };
  var CHECKABLE = { assignment: 1, todo: 1 };
  var STATE_TXT = { graded: "채점 완료", submitted: "제출됨 · 채점 대기", pending: "미제출", upcoming: "예정", hidden: "점수 미공개" };
  var STATE_CLS = { graded: "ok", submitted: "acc", pending: "urgent", upcoming: "", hidden: "" };
  var ROUTE_RE = /^(home|week|calendar|grades|course-[a-z0-9]+)$/;
  var $ = function (s) { return document.querySelector(s); };
  function pad(n) { return String(n).padStart(2, "0"); }

  function h(tag, attrs) {
    var e = document.createElement(tag);
    if (attrs) Object.keys(attrs).forEach(function (k) {
      var v = attrs[k];
      if (v == null || v === false) return;
      if (k === "class") e.className = v;
      else if (k === "text") e.textContent = v;
      else if (k === "style") e.setAttribute("style", v);
      else if (k.slice(0, 2) === "on") e.addEventListener(k.slice(2), v);
      else if (v === true) e.setAttribute(k, "");
      else e.setAttribute(k, v);
    });
    for (var i = 2; i < arguments.length; i++) {
      var c = arguments[i];
      if (Array.isArray(c)) c.forEach(function (x) { if (x != null && x !== false) e.append(x.nodeType ? x : document.createTextNode(x)); });
      else if (c != null && c !== false) e.append(c.nodeType ? c : document.createTextNode(c));
    }
    return e;
  }

  /* ---------- 날짜 ---------- */
  var fmt = new Intl.DateTimeFormat("en-US", { timeZone: KST, year: "numeric", month: "numeric", day: "numeric", hour: "numeric", minute: "numeric", hour12: false });
  function parts(d) {
    var o = {};
    fmt.formatToParts(d).forEach(function (p) { o[p.type] = p.value; });
    var hh = +o.hour; if (hh === 24) hh = 0;
    return { y: +o.year, m: +o.month, d: +o.day, hh: hh, mm: +o.minute };
  }
  function key(p) { return p.y + "-" + pad(p.m) + "-" + pad(p.d); }
  function dayIdx(k) { var a = k.split("-").map(Number); return Date.UTC(a[0], a[1] - 1, a[2]) / 86400000; }
  function fromIdx(i) { var d = new Date(i * 86400000); return d.getUTCFullYear() + "-" + pad(d.getUTCMonth() + 1) + "-" + pad(d.getUTCDate()); }
  function wdOf(k) { return WD[new Date(dayIdx(k) * 86400000).getUTCDay()]; }
  function todayKey() { return key(parts(new Date())); }
  function diff(k) { return dayIdx(k) - dayIdx(todayKey()); }
  function dLabel(d) { return d === 0 ? "오늘" : d === 1 ? "내일" : d > 1 ? "D-" + d : Math.abs(d) + "일 지남"; }
  function dClass(d, done) { return done ? "ok" : d <= 1 ? "urgent" : d <= 7 ? "soon" : ""; }
  function md(k) { var a = k.split("-"); return Number(a[1]) + "/" + Number(a[2]); }
  function mondayOf(k) { var i = dayIdx(k), w = new Date(i * 86400000).getUTCDay(); return fromIdx(i - ((w + 6) % 7)); }

  /* ---------- 상태 ---------- */
  var state = { items: [], courses: {}, plans: [], grades: {}, notes: {}, meta: null, filter: "all", showPast: false, calKey: "", sel: todayKey(), loaded: false };
  var dbRef = null, pending = {}, deferred = false;

  function norm(id, d) {

      listen(db, "plans", function (docs) { state.plans = docs.map(function (d) { var x = d.data(); x.id = d.id; return x; }); });
      listen(db, "grades", function (docs) { var g = {}; docs.forEach(function (d) { g[d.id] = d.data(); }); state.grades = g; });
      db.collection("notes").onSnapshot(function (s) { var n = {}; s.docs.forEach(function (d) { n[d.id] = d.data(); }); state.notes = n; }, function () {});
      db.doc("meta/briefing").onSnapshot(function (s) { state.meta = s.exists ? s.data() : null; scheduleRender(); }, function () {});
    }).catch(function () { clearTimeout(timer); state.loaded = true; renderAll(); });
  }
  boot();
})();
</script>
